name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    name: Build, pack, and publish
    if: |
      github.event.pull_request.merged == true
      && github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Extract version from branch name
        id: v
        run: |
          ref="${{ github.event.pull_request.head.ref }}"
          version="${ref#release/}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::source branch '$ref' is not 'release/<semver>'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            9.0.x
            10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify formatting (csharpier)
        run: dotnet csharpier check .

      - name: Restore
        run: dotnet restore Enver.slnx

      - name: Build
        run: dotnet build Enver.slnx --configuration Release --no-restore -p:Version=${{ steps.v.outputs.version }}

      - name: Test
        run: dotnet test Enver.slnx --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Pack
        run: dotnet pack Enver.slnx --configuration Release --no-build -p:Version=${{ steps.v.outputs.version }}

      - name: Login to NuGet (OIDC trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: gnarsoftware

      - name: Push to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push 'artifacts/packages/*.nupkg' \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          v="${{ steps.v.outputs.version }}"
          if [[ ! -f CHANGELOG.md ]]; then
            echo "::error::CHANGELOG.md not found"
            exit 1
          fi
          # Print everything from the "## [<version>] - <date>" header to the
          # next "## " heading (exclusive), then trim leading/trailing blank
          # lines.
          awk -v v="$v" '
            $0 ~ "^## \\["v"\\]" { p=1; next }
            p && /^## / { exit }
            p { print }
          ' CHANGELOG.md \
            | awk 'NF{f=1} f' \
            | awk '{ lines[NR]=$0 } END { last=NR; while (last>0 && lines[last]=="") last--; for (i=1;i<=last;i++) print lines[i] }' \
            > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "::error::no CHANGELOG.md section matches '## [$v]'"
            exit 1
          fi
          echo "Release notes for v$v:"
          echo "---"
          cat release-notes.md
          echo "---"

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ steps.v.outputs.version }}"
          pre=""
          if [[ "$v" == *-* ]]; then pre="--prerelease"; fi
          gh release create "v$v" \
            artifacts/packages/*.nupkg artifacts/packages/*.snupkg \
            --target "${{ github.event.pull_request.merge_commit_sha }}" \
            --notes-file release-notes.md \
            $pre
